<!doctype html><html><head><meta charset=utf-8>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel=stylesheet>
<link rel=stylesheet href=common.css>
<style>
.b{width:640px;height:200px}
/* venue photo across the whole strip, dimmed under the copy */
.photo{position:absolute;inset:0;background:url(venue.jpg) no-repeat;background-size:400px 250px;background-position:-60px -22px}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,27,61,.15) 0,rgba(3,27,61,.55) 26%,rgba(3,27,61,.93) 44%,#031b3d 60%)}
.crest{position:absolute;left:30px;top:10px;height:118px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.7))}
.ss{position:absolute;left:16px;bottom:14px;width:146px;height:52px;background:#fff;display:flex;align-items:center;justify-content:center}
.ss img{width:128px}
.redline{height:5px}
.right{position:absolute;left:176px;right:16px;top:11px;bottom:13px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center}
.date{font-size:33px}
.det{font-size:26px;line-height:1.1}
.rule{width:80%;height:3px;background:#dc0117}
.right .bar{font-size:24px;padding:3px 10px 4px}
</style></head><body>
<div class="b" id=banner>
 <div class=photo></div><div class=shade></div>
 <div class=dots></div>
 <img class=crest src=crest.png alt="">
 <div class=ss><img src=ss-logo.png alt=""></div>
 <div class=right>
  <span class=date>Thursday, Feb 25 &nbsp;|&nbsp; 1PM – 4PM</span>
  <span class=det><b style="font-weight:600;color:#fff">Open Bar</b> | Beer · Seltzers<br>Wine · Select Spirits</span>
  <span class=rule></span>
  <span class=det>143 Foot Screen &amp; Live DJ</span>
  <span class=bar>The Ultimate Rugby League Pool Party</span>
 </div>
 <div class=redline></div>
</div></body></html>
